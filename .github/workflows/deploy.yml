name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 배포·롤백

concurrency:
  group: deploy-production
  cancel-in-progress: false # 배포는 중단하지 않는다(동시 1개만)

jobs:
  deploy:
    name: Deploy to production (SSH)
    # GitHub 호스팅 러너는 계정 결제/지출한도 문제로 배정되지 않을 수 있다
    # (2026-07-30 실제 발생 — 잡이 시작조차 못 하고 실패). CI와 동일하게
    # self-hosted 러너에서 SSH 배포를 실행한다.
    runs-on: [self-hosted, Linux, X64]
    environment: production

    steps:
      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "▶ 최신 main 반영"
            git fetch --prune origin
            git reset --hard origin/main

            echo "▶ writable 디렉토리 보장 (마이그레이션/부팅 전 필수 — 없으면 WRITEPATH 오류)"
            mkdir -p writable/cache writable/logs writable/session writable/uploads writable/debugbar
            # 런타임에 아파치(www-data)가 만든 파일 소유권 충돌 대비 best-effort
            chmod -R 2775 writable 2>/dev/null || echo "  (writable chmod 건너뜀)"

            echo "▶ 의존성 설치 (운영)"
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "▶ DB 마이그레이션"
            # spark migrate 는 DB 오류·예외에도 종료코드 0 을 반환하므로
            # 출력을 캡처해 예외 패턴을 직접 검사하고, 감지 시 배포를 중단한다.
            MIGRATE_OUT="$(php spark migrate --all -f 2>&1)" || true
            echo "$MIGRATE_OUT"
            if echo "$MIGRATE_OUT" | grep -qiE "Exception|Unable to connect|Access denied|Call to|Fatal error"; then
              echo "✖ 마이그레이션 실패 감지 — 배포 중단"
              exit 1
            fi

            echo "▶ 캐시 정리"
            php spark cache:clear || true

            echo "▶ 아파치 리로드 (OPcache 갱신, 무중단)"
            sudo -n systemctl reload apache2

            echo "✔ 배포 완료"

      - name: Slack 배포 알림
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || format('workflow_dispatch 수동 실행 ({0})', github.sha) }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "⚠ SLACK_WEBHOOK_URL 미설정 — 알림 건너뜀"
            exit 0
          fi

          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            STATUS_TEXT="[$REPO] 배포 성공"
            COLOR="#2eb886"
          else
            STATUS_TEXT="[$REPO] 배포 실패"
            COLOR="#e01e5a"
          fi

          # 커밋 메시지는 제목 줄만 사용, Slack 링크 구문(<url|text>)을 깨는 문자는 치환
          COMMIT_SUBJECT="$(printf '%s' "$COMMIT_MESSAGE" | head -n1 | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/|/-/g')"

          PAYLOAD="$(jq -n \
            --arg status "$STATUS_TEXT" \
            --arg color "$COLOR" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg message "$COMMIT_SUBJECT" \
            --arg commit_url "$COMMIT_URL" \
            '{
              attachments: [{
                color: $color,
                blocks: [{
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("*" + $status + "*\n\n저장소: " + $repo + "\n\n브랜치: " + $branch + "\n\n작성자: " + $actor + "\n\n내용: <" + $commit_url + "|" + $message + ">")
                  }
                }]
              }]
            }')"

          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL" || echo "⚠ Slack 알림 전송 실패(배포 결과에는 영향 없음)"
