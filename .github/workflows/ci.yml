name: CI

on:
  pull_request:
    branches: [main]     # dev 로 가는 PR 에서는 돌지 않는다 — 검증은 로컬(pre-push 훅)에서 끝낸다

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP CS Fixer · PHPStan · PHPUnit (MySQL)
    # self-hosted(macOS) 러너는 services: 도커 컨테이너를 지원하지 않는다
    # (GitHub Actions 서비스 컨테이너는 Linux 러너 전용). 대신 MySQL을
    # docker run 으로 직접 띄우고 잡 종료 시 정리한다.
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f ci-mysql-${{ github.run_id }} 2>/dev/null || true
          # 이 러너는 시스템 MySQL(mysqld)이 이미 3306을, AIFid CI 가 13306을
          # 점유하고 있어 이 저장소 전용 포트(33306)로 띄운다.
          docker run -d --name ci-mysql-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=aicassa_test \
            -p 33306:3306 \
            mysql:8.0
          for i in $(seq 1 30); do
            docker exec ci-mysql-${{ github.run_id }} mysqladmin ping -proot --silent && break
            sleep 2
          done

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, mysqli, curl, dom, xml, tokenizer
          coverage: pcov
          tools: composer

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Prepare .env (테스트 DB → MySQL 컨테이너)
        run: |
          cp env .env
          {
            echo "CI_ENVIRONMENT = testing"
            echo "JWT_SECRET = ci-test-secret-key-should-be-32-characters-min"
            echo "database.tests.hostname = 127.0.0.1"
            echo "database.tests.database = aicassa_test"
            echo "database.tests.username = root"
            echo "database.tests.password = root"
            echo "database.tests.DBDriver = MySQLi"
            echo "database.tests.port = 33306"
          } >> .env

      - name: Prepare writable directories
        run: mkdir -p writable/cache writable/logs writable/session writable/uploads writable/debugbar build/logs

      - name: PHP CS Fixer (dry-run)
        run: composer cs

      - name: PHPStan (level 6)
        run: composer analyse

      - name: PHPUnit (MySQL)
        run: composer test

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f ci-mysql-${{ github.run_id }} 2>/dev/null || true
